    not a fidelity defect."
  design_review_seat: "STOP: INCOMPLETE_ENTRY (procedural, not a defect) — the reviewing
    session declined to issue a visual verdict, citing (a) this YAML packet's extra keys
    (issue_ref, notes, review_outcome) beyond the VQG v1.2 closed §10 schema, and (b) an
    unresolved independence concern about reviewing an artifact prepared in the same
    working session. No concrete visual defect was reported against candidate-3; the
    round-2 defect that same seat had previously found (label crossing GitHub.com title)
    was separately confirmed fixed by the independent QA seat."
  ship_decision: "Owner (Josh) authorized shipping portfolio-dashboard-archify.html as the
    Stage 4 deliverable on the strength of the independent QA PASS, accepting the
    Design Review seat's procedural non-verdict rather than reformatting the packet to the
    full closed §10 schema or re-running review in a stricter isolation harness. This
    decision and its rationale are recorded here per VQG optional owner override
    provisions; topology.html is retained in the repo as a secondary/alternate rendering,
    not the primary shipped artifact."
